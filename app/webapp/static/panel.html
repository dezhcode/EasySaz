<!DOCTYPE html>
<html lang="fa" dir="rtl" data-base="__BASE__" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ایزی‌ساز</title>
<link rel="icon" href="__BASE__static/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="__BASE__static/brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="__BASE__static/brand/apple-touch-icon.png">
<link rel="preload" href="__BASE__static/fonts/peyda-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="__BASE__static/fonts/peyda-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="__BASE__static/peyda.css">
<link rel="stylesheet" href="__BASE__static/tokens.css?v=21">
<link rel="stylesheet" href="__BASE__static/render.css?v=21">
<link rel="stylesheet" href="__BASE__static/panel.css?v=21">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<!-- اسپلش: نشان ایزی‌ساز + نوار بارگذاری (مثل عبور) -->
<div id="splash" class="splash" aria-hidden="true"><span class="mark mark-lg"></span><div class="bar"><i></i></div></div>

<!-- ═══ خانه (تب) — ویترین ═══
     هر مینی‌اپ یک گوشی واقعی روی صحنه (همان صفحه‌ای که خواننده می‌بیند)؛ ورق
     زدن بین مینی‌اپ‌ها و آخرش گوشی خالی «تازه». زیر گوشی وسط: اسم، روشن/خاموش،
     آدم‌های این هفته و فقط یک کار اصلی + «مدیریت». -->
<section id="home" class="screen tabscreen home-v" hidden>
  <header class="hi">
    <div class="grow"><div class="hi-s" id="hello-s">سلام</div><h1 class="hi-t">مینی‌اپ‌های تو</h1></div>
    <button class="av" id="home-av" aria-label="حساب"></button>
  </header>
  <div class="vt" id="vt">
    <i class="vt-glow" id="vt-glow" aria-hidden="true"></i>
    <div class="vt-rail" id="vt-rail" aria-label="مینی‌اپ‌ها"></div>
  </div>
  <div class="vt-info" id="vt-info" aria-live="polite"></div>
  <div class="vt-dots" id="vt-dots" aria-hidden="true"></div>
</section>

<!-- ═══ قالب‌ها (تب): فروشگاه قالب ═══ -->
<section id="store" class="screen tabscreen" hidden>
  <header class="hi">
    <h1 class="hi-t grow">قالب‌ها</h1>
    <button class="round" id="store-find" aria-label="جستجوی قالب"><span data-icon="search"></span></button>
  </header>
  <label class="find mx" id="store-q-box" hidden><span data-icon="search"></span><input id="store-q" type="search" placeholder="جستجوی قالب یا کار…" aria-label="جستجوی قالب" autocomplete="off"></label>
  <div class="cats" id="store-cats" role="tablist" aria-label="حوزه‌ها"></div>
  <div id="store-feat"></div>
  <div class="tgrid" id="store-grid"></div>
</section>

<!-- ═══ آمار (تب) ═══ -->
<section id="stats" class="screen tabscreen" hidden>
  <header class="hi"><h1 class="hi-t grow">آمار</h1></header>
  <div class="cats" id="stats-apps" role="tablist" aria-label="مینی‌اپ‌ها"></div>
  <div id="stats-body"></div>
</section>

<!-- ═══ حساب (تب) — کاشی‌ها ═══ -->
<section id="account" class="screen tabscreen" hidden>
  <header class="hi"><h1 class="hi-t grow">حساب</h1></header>
  <div class="bt-grid" id="acc-body"></div>
</section>

<!-- ═══ داشبورد یک مینی‌اپ — کاشی‌ها (بنتو) ═══
     پیش‌نمایش زنده، کلید بزرگ روشن/خاموش، لینک و QR، آخرین قسمت، آمار هفته
     و کاشی‌های کوچک ربات، پیام خوش‌آمد و قالب. «انتشار» فقط وقتی لازم است. -->
<section id="app" class="screen appdash" hidden>
  <header class="bt-top">
    <button class="round" id="ad-back" aria-label="برگشت به خانه"><span data-icon="back"></span></button>
    <div class="grow bt-id"><h1 class="bt-name" id="ad-name"></h1><span class="bt-sub" id="ad-sub"></span></div>
    <button class="round" id="ad-more" aria-label="تنظیمات مینی‌اپ"><span data-icon="settings"></span></button>
  </header>
  <main class="bt-grid" id="ad-body"></main>
</section>

<!-- ═══ ساخت مینی‌اپ تازه (کانال داستان با قالب قسمت) ═══
     ۱. اسم و لوگو (کارت عبور زنده)  ۲. رنگ تأکید (پیش‌نمایش مینی‌اپ خودش)
     آخرش مینی‌اپ کامل در «داستان‌ها» باز می‌شود. -->
<section id="onboard" class="screen wizard" hidden>
  <header class="topbar">
    <button class="back" id="wz-back" aria-label="برگشت"><span data-icon="back"></span></button>
    <div class="wz-head"><div class="topbar-t" id="wz-title"></div><div class="topbar-s" id="wz-sub"></div></div>
    <div class="wz-dots" aria-hidden="true"><i></i><i></i></div>
  </header>

  <div class="wz-step" id="wz-2" hidden>
    <div class="mx">
      <div class="wz-tpl" id="wz-tpl"></div>
      <!-- کارت همین مینی‌اپ، همان شکلی که در خانه دیده می‌شود -->
      <article class="acard ob-card" id="ob-card" aria-hidden="true">
        <div class="acard-band"><i class="o1"></i><i class="o2"></i><span class="pill"><i></i>پیش‌نویس</span></div>
        <div class="acard-b">
          <span class="tq lg halo ob-icon" id="ob-pass-initial"></span>
          <div class="acard-t"><b id="ob-pass-name">اسم مینی‌اپت</b><span id="ob-pass-kind"></span></div>
        </div>
      </article>
    </div>
    <div class="ob-body mx">
      <label for="ob-name" class="ob-label">اسمش چیه؟</label>
      <input id="ob-name" class="ob-input" maxlength="40" placeholder="مثلاً: کابوس‌های کوتاه" autocomplete="off">
      <div id="ob-chips" class="chips"></div>
      <button class="logo-pick" id="wz-logo" type="button"><span class="ic brand" id="wz-logo-ic" data-icon="upload"></span><span class="row-m"><span class="row-t" id="wz-logo-t">لوگو (اختیاری)</span><span class="row-s">روی کارت، سربرگ و ربات دیده می‌شود</span></span></button>
    </div>
  </div>

  <div class="wz-step" id="wz-3" hidden>
    <div class="moods" id="wz-moods" role="radiogroup" aria-label="حال‌وهوا"></div>
    <p class="hint">بعداً از «ظاهر» هر رنگی خواستی می‌تونی بذاری.</p>
  </div>

  <div class="foot"><button id="wz-next" class="btn btn-p btn-block" disabled>ادامه</button></div>
</section>


<!-- ═══ داستان‌ها (تب): پنل مدیریت داستان‌ها ═══
     فهرست داستان‌ها با جلد، «داستان تازه» (اسم، جلد، عنوان کوتاه، توضیحات)،
     هر داستان یک زیرصفحه با قسمت‌ها، و هر قسمت ادیتور متن با سبک‌های نوشتاری. -->
<section id="stories" class="screen stories" hidden>
  <header class="st-top">
    <button class="round" id="st-back" aria-label="برگشت به مینی‌اپ"><span data-icon="back"></span></button>
    <div class="grow">
      <div class="st-k" id="st-app"></div>
      <div class="st-t">داستان‌ها</div>
      <span class="status caption" id="st-status"><i class="dot"></i><span></span></span>
    </div>
    <button class="icon-btn sm flat" id="st-preview" aria-label="پیش‌نمایش"><span data-icon="eye"></span></button>
    <button class="btn btn-p btn-sm publish" id="st-publish"><i class="dot"></i>انتشار</button>
  </header>
  <main id="st-body"></main>
</section>

<!-- ═══ ادیتور (طرح د: بخش‌ها) ═══
     هر کامپوننت یک «بخش» با نوار نام همیشگی است (دستگیره، ویرایش، بیشتر).
     بین بخش‌ها «+ افزودن این‌جا». ویرایش، ظاهر، صفحه‌ها و تنظیمات زیرصفحه‌اند
     (#subs) با مسیر بالا و پیش‌نمایش زنده. -->
<section id="editor" class="screen editor" hidden>
  <header class="etop">
    <div class="etop-row">
      <button class="icon-btn sm" id="ed-back" aria-label="برگشت به خانه"><span data-icon="back"></span></button>
      <button class="etop-app" id="bar-app" aria-label="تنظیمات مینی‌اپ">
        <b id="bar-name"></b>
        <span class="status" id="bar-status"><i class="dot"></i><span></span></span>
      </button>
      <button class="icon-btn sm flat" id="bar-undo" aria-label="برگرد" disabled><span data-icon="undo"></span></button>
      <button class="icon-btn sm flat" id="bar-redo" aria-label="دوباره" disabled><span data-icon="redo"></span></button>
      <button class="icon-btn sm flat" id="bar-preview" aria-label="پیش‌نمایش"><span data-icon="eye"></span></button>
      <button class="btn btn-p btn-sm publish" id="bar-publish"><i class="dot"></i>انتشار</button>
    </div>
    <div class="utabs" id="pagestrip" role="tablist" aria-label="صفحه‌های مینی‌اپ"></div>
  </header>
  <main class="secs" id="secs"></main>
  <nav class="dock" id="toolbar" aria-label="ابزارها">
    <div class="dock-st">
      <span class="status" id="dock-status"><i class="dot"></i><span></span></span>
      <span class="dock-cnt" id="dock-count"></span>
    </div>
    <div class="dock-row">
      <button data-act="theme"><span class="dock-t" data-icon="palette"></span><span class="dock-l">ظاهر</span></button>
      <button data-act="stories"><span class="dock-t" data-icon="book"></span><span class="dock-l">داستان‌ها</span></button>
      <button data-act="add" class="dock-add"><span data-icon="plus"></span>افزودن بخش</button>
      <button data-act="order"><span class="dock-t" data-icon="order"></span><span class="dock-l">ترتیب</span></button>
      <button data-act="settings"><span class="dock-t" data-icon="settings"></span><span class="dock-l">تنظیمات</span></button>
    </div>
  </nav>
</section>
<!-- زیرصفحه‌های ادیتور (پشته؛ برگشت تلگرام یکی را می‌بندد) -->
<div id="subs"></div>

<section id="blocked" class="screen blocked" hidden>
  <span class="mark mark-lg"></span>
  <b class="topbar-t">پنل ایزی‌ساز</b>
  <p class="empty-s" id="blocked-msg">این پنل داخل تلگرام و از ربات @EasySazBot باز می‌شه.</p>
  <a class="btn btn-s" href="#demo" id="demo-link">دیدن نسخهٔ نمایشی</a>
</section>

<!-- ناوبری پایین (آتلیه روی منشور): سفید و چسبیده، برچسب زیر همه، نقطه زیر تب فعال؛
     «ساختن» مربع تیرهٔ وسط است و شیت «چه می‌سازی؟» را باز می‌کند. -->
<nav id="nav" class="nav" aria-label="ناوبری" hidden>
  <button class="nav-i" data-tab="home"><span data-icon="home"></span><span class="nav-l">خانه</span><i class="nav-d"></i></button>
  <button class="nav-i" data-tab="store"><span data-icon="grid"></span><span class="nav-l">قالب‌ها</span><i class="nav-d"></i></button>
  <button class="nav-make" id="nav-make" aria-label="ساختن"><span data-icon="plus"></span></button>
  <button class="nav-i" data-tab="stats"><span data-icon="chart"></span><span class="nav-l">آمار</span><i class="nav-d"></i></button>
  <button class="nav-i" data-tab="account"><span data-icon="user"></span><span class="nav-l">حساب</span><i class="nav-d"></i></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"><span class="toast-ico"></span><span class="toast-txt"></span></div>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>

<script src="__BASE__static/render.js?v=21"></script>
<script src="__BASE__static/demo.js?v=21"></script>
<script src="__BASE__static/panel.js?v=21"></script>
</body>
</html>
